<!DOCTYPE html>
<html lang="tr">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Çevrimdışı</title>
	<style>
		body {
			margin: 0;
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
			background: #f8fafc;
			color: #0f172a;
			padding: 1.5rem;
		}
		.box {
			max-width: 24rem;
			text-align: center;
		}
		h1 {
			font-size: 1.25rem;
			margin: 0 0 0.5rem;
		}
		p {
			margin: 0;
			opacity: 0.75;
			line-height: 1.5;
		}
	</style>
</head>
<body>
	<div class="box">
		<h1>İnternet bağlantısı yok</h1>
		<p>Bağlantınızı kontrol edip tekrar deneyin.</p>
	</div>
</body>
</html>
